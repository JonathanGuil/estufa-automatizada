persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Sem acesso anônimo: todo cliente precisa de usuário/senha
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Listener interno (rede Docker) - sem TLS. Não é publicado ao host.
# Usado pelos backends (backend-prod / backend-hml).
listener 1883

# Listener EXTERNO (internet) - TLS. Usado pelo ESP32.
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
